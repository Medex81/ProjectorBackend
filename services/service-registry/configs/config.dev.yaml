# services/service-registry/configs/config.dev.yaml
service:
  name: service-registry
  port: 8081
  grpc_port: 50051
  environment: development
  version: 1.0.0
  shutdown_timeout: 30s

database:
  host: postgres-registry
  port: 5432
  user: projector
  password: projector123
  dbname: registry
  sslmode: disable

redis:
  addr: redis:6379
  password: ""
  db: 0

kafka:
  brokers:
    - kafka:9092
  topics:
    email_verification: email-verification
    service_events: service-events
    logs: service-logs

auth:
  jwt_secret: your-secret-key-here
  token_expiration: 720h  # 30 days
  verification_code_ttl: 10m

gateway:
  http_port: 8080
  https_port: 8443
  ws_port: 8080
  udp_port: 8080
  grpc_port: 50052

mail:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_user: your-email@gmail.com
  smtp_password: your-password
  from_email: no-reply@projector.com

jaeger:
  agent_host: jaeger
  agent_port: 6831